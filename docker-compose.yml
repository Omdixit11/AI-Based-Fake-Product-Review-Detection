name: truthlens

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: truthlens-backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:3000
      - DATABASE_URL=sqlite:////data/history.db
      - ENABLE_TIER1=true
      - ENABLE_SARCASM=true
      - ENABLE_SHAP=false
    volumes:
      - ./backend/models:/app/models:ro
      - truthlens-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_USE_MOCK: "false"
    container_name: truthlens-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  truthlens-data:
    name: truthlens_history_data
